[package]
name = "jev-cli"
version = "0.3.0"
edition = "2021"
description = "A CLI tool to interact with Typesafe.ai and OpenRouter"
repository = "https://github.com/Salv4d/jev-cli"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
dotenvy = "0.15"
anyhow = "1.0"
tokio = { version = "1.34", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
